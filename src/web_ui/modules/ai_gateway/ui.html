<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 账号与反代</title><link rel="stylesheet" href="/shared/mp_theme.css">
<link rel="stylesheet" href="/shared/mp_task.css">
<style>select,input{padding:9px;border:1px solid var(--mp-border);border-radius:8px;background:var(--mp-bg);color:inherit}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid var(--mp-border)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hint{color:var(--mp-muted);line-height:1.7}dialog{max-width:440px;border:1px solid #aaa;border-radius:16px;padding:24px;background:var(--mp-bg);color:var(--mp-fg)}dialog img{display:block;width:290px;max-width:100%;margin:16px auto}code{word-break:break-all}#status{min-height:30px}button:disabled{opacity:.4}</style></head>
<body><main class="wrap"><h1>AI 账号与反代</h1><p class="hint">扫码添加多个账号，或本地解密导入登录态。签到通过 HTTP 执行。</p>
<section class="card"><div class="row"><select id="platform"></select><button class="btn-main" id="login">扫码添加账号</button><button class="btn-ghost" id="import">导入本机登录态</button><button class="btn-ghost" id="refresh">刷新</button></div>
<p id="capabilities" class="hint"></p><div style="overflow:auto"><table><thead><tr><th>平台</th><th>账号</th><th>状态</th><th>账号 ID</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></div></section>
<section class="card"><h2>兼容 API</h2><p>Base URL：<code id="base"></code></p><div class="row"><button id="key" class="btn-ghost">复制 API Key</button><button id="models" class="btn-ghost">查询可用模型</button></div>
<p class="hint">支持 OpenAI Chat Completions、Anthropic Messages 的流式回复和工具调用。模型使用“平台/模型”格式，同平台账号依次轮换；X-AI-Account 请求头可指定账号。凭据由 Windows 当前用户加密保存。</p><pre id="modelList"></pre></section><p id="status" role="status"></p></main>
<dialog id="dialog"><h2>扫码授权</h2><p class="hint">用手机扫描后完成平台授权。每次授权添加一个账号。</p><img id="qr" alt="平台授权二维码"><p id="loginStatus"></p><input id="url" readonly style="width:100%;box-sizing:border-box"><div class="row" style="margin-top:16px"><button class="btn-ghost" id="copyUrl">复制授权链接</button><button class="btn-main" id="close">关闭</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let state={providers:[],accounts:[]},session=null,timer=null,polling=false,generation=0;
async function api(path,method='GET',body){const r=await fetch('/ai-gateway/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||d.detail||'请求失败');return d}
function error(e){$('status').textContent=e.message}
function action(fn){return ()=>Promise.resolve().then(fn).catch(error)}
function caps(){const p=state.providers.find(p=>p.id===$('platform').value),c=p?.capabilities||{};$('login').disabled=!c.login;$('import').disabled=!c.local_import;$('capabilities').textContent=[['login','扫码授权'],['local_import','本地导入'],['chat','聊天反代'],['checkin','HTTP 签到']].filter(([k])=>c[k]).map(([,v])=>v).join(' · ')+(c.reason?'。'+c.reason:'')}
async function load(){state=await api('state');const selected=$('platform').value;$('platform').replaceChildren(...state.providers.map(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;return o}));if(state.providers.some(p=>p.id===selected))$('platform').value=selected;caps();$('base').textContent=state.base_url;$('accounts').replaceChildren();for(const a of state.accounts){const tr=document.createElement('tr');for(const value of [state.providers.find(p=>p.id===a.provider)?.name||a.provider,a.label,a.enabled?'已启用':'已停用',a.id]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const td=document.createElement('td');for(const [title,fn] of [[a.enabled?'停用':'启用',async()=>{await api('accounts/'+a.id,'PATCH',{enabled:!a.enabled});await load()}],['移除',async()=>{await api('accounts/'+a.id,'DELETE');await load()}]]){const b=document.createElement('button');b.className='btn-ghost';b.textContent=title;b.onclick=action(fn);td.append(b)}tr.append(td);$('accounts').append(tr)}}
async function cancel(){generation++;clearTimeout(timer);const old=session;session=null;$('dialog').close();if(old)await api('login/'+old,'DELETE')}
async function poll(id,gen){if(gen!==generation||session!==id||polling)return;polling=true;try{const d=await api('login/'+id);if(gen!==generation||session!==id)return;if(d.status==='authorized'){$('status').textContent='账号已添加';await cancel();await load()}else if(['expired','denied'].includes(d.status)){$('loginStatus').textContent='授权已过期或取消，请关闭后重新扫码'}else{$('loginStatus').textContent=d.status==='scanned'?'已扫码，请在手机确认':'等待扫码授权…';timer=setTimeout(()=>poll(id,gen),2500)}}catch(e){$('loginStatus').textContent=e.message}finally{polling=false}}
$('platform').onchange=caps;$('refresh').onclick=action(load);$('login').onclick=action(async()=>{$('login').disabled=true;try{const d=await api('login/'+$('platform').value,'POST',{});session=d.id;const gen=++generation;$('qr').src=d.qr_data;$('url').value=d.auth_url;$('loginStatus').textContent='等待扫码授权…';$('dialog').showModal();timer=setTimeout(()=>poll(d.id,gen),2500)}finally{caps()}});
$('import').onclick=action(async()=>{$('import').disabled=true;try{const d=await api('import/'+$('platform').value,'POST',{});await load();$('status').textContent='已导入 '+d.count+' 个账号'}finally{caps()}});
$('key').onclick=action(async()=>{const d=await api('key');await navigator.clipboard.writeText(d.api_key);$('status').textContent='API Key 已复制'});
$('models').onclick=action(async()=>{const d=await api('models');$('modelList').textContent=d.data.map(m=>m.id).join('\n')||'暂无模型，请先添加支持反代的平台账号'});
$('close').onclick=action(cancel);$('dialog').addEventListener('cancel',e=>{e.preventDefault();cancel().catch(error)});$('copyUrl').onclick=action(()=>navigator.clipboard.writeText($('url').value));load().catch(error);
</script></body></html>
