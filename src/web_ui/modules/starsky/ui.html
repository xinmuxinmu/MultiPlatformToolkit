<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarSky 签到</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:#f4f6fa;color:#1f2937;line-height:1.6;min-height:100vh;padding:28px 20px 48px}
.wrap{max-width:1020px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:21px;font-weight:650;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:#eab308;box-shadow:0 0 0 4px rgba(234,179,8,.16)}
.sub{font-size:12.5px;color:#8b95a5;margin-top:3px}
.links{display:flex;gap:14px;font-size:13px}
.links a{color:#2563eb;text-decoration:none;font-weight:600}
.links a.muted{color:#64748b;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #edf0f5;border-radius:14px;padding:16px 17px;
  box-shadow:0 1px 3px rgba(16,24,40,.04);min-height:140px;display:flex;flex-direction:column}
.card h2{font-size:12px;font-weight:650;color:#94a3b8;letter-spacing:.5px;margin-bottom:10px}
.state{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:650;padding:2px 9px;border-radius:20px;background:#f1f5f9;color:#64748b}
.pill.ok{background:#e8f9ef;color:#16a34a}
.pill.warn{background:#fff7ed;color:#c2410c}
.pill.err{background:#fef2f2;color:#dc2626}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:#8b95a5;flex:none}
.kv span:last-child{color:#334155;font-weight:550;text-align:right;word-break:break-all}
section{margin-top:18px}
h3{font-size:13px;font-weight:650;color:#64748b;letter-spacing:.4px;margin-bottom:10px}
.form{background:#fff;border:1px solid #edf0f5;border-radius:14px;padding:16px 17px;
  box-shadow:0 1px 3px rgba(16,24,40,.04);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.path-field{grid-column:span 2}
@media(max-width:820px){.form{grid-template-columns:1fr}.path-field{grid-column:auto}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:#94a3b8}
.field input,.field select{font:inherit;font-size:13px;border:1px solid #e2e8f0;border-radius:9px;
  padding:8px 10px;color:#334155;background:#fff;min-width:0}
.field input:focus,.field select:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:13.5px;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;
  border:1px solid #e2e8f0;background:#fff;color:#334155;transition:.15s}
button:hover:not(:disabled){border-color:#bfd3f9;color:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.08)}
button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
button.primary:hover:not(:disabled){background:#1d4ed8;color:#fff}
button.danger{color:#dc2626;border-color:#fecaca;background:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:6px 12px;font-size:12px}
input.time{font:inherit;font-size:13px;border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px;color:#334155}
.note{margin-top:10px;font-size:12px;color:#94a3b8}
.err{margin-top:10px;font-size:12.5px;color:#dc2626;font-weight:600;min-height:18px}
.log-card{background:#0f172a;border-radius:14px;padding:14px 16px;border:1px solid #1e293b}
.log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-head b{font-size:12px;color:#94a3b8;letter-spacing:.5px;font-weight:650}
.log{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px;line-height:1.65;
  color:#cbd5e1;white-space:pre-wrap;word-break:break-all;height:260px;overflow:auto}
.log .ok{color:#86efac}
.log .bad{color:#fca5a5}
.warn-box{margin-top:14px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;
  padding:11px 14px;font-size:12.5px;color:#92400e;line-height:1.7}
body.mp-embedded{padding:14px 18px 24px}
body.mp-embedded .wrap{max-width:none}
body.mp-embedded header{display:none}
</style>
<link rel="stylesheet" href="/shared/mp_ui.css?v=2">
<script src="/shared/mp_ui.js?v=2"></script>
</head>
<body>
<script>if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('mp-embedded');</script>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot"></span>StarSky 签到</h1>
      <div class="sub">读取本地登录态后台签到，支持每日自动执行</div>
    </div>
    <div class="links"><a href="/" class="muted">返回首页</a></div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>运行环境</h2>
      <div class="state"><span id="admin-pill" class="pill">检测中</span><span id="task-pill" class="pill">任务检测中</span></div>
      <div class="kv" style="margin-top:10px"><span>计划任务</span><span id="task-state">—</span></div>
      <div class="kv"><span>下次运行</span><span id="task-next">—</span></div>
      <div class="kv"><span>软件路径</span><span id="exe-state">—</span></div>
    </div>

    <div class="card">
      <h2>最近签到</h2>
      <div class="state"><span class="pill ok">日志</span></div>
      <div class="kv" style="margin-top:10px"><span>文件更新</span><span id="log-time">—</span></div>
      <div class="kv"><span>最后一条</span><span id="last-line">—</span></div>
    </div>

    <div class="card">
      <h2>当前任务</h2>
      <div class="state"><span id="run-pill" class="pill">空闲</span></div>
      <div class="kv" style="margin-top:10px"><span>启动方式</span><span id="run-via">—</span></div>
      <div class="kv"><span>启动时间</span><span id="run-start">—</span></div>
      <div class="kv"><span>退出码</span><span id="run-code">—</span></div>
    </div>
  </div>

  <section>
    <h3>配置</h3>
    <div class="form">
      <div class="field"><label>签到方式</label><select id="cfg-mode"><option value="api">本地账户后台签到</option><option value="desktop">窗口点击签到</option></select></div>
      <div class="field path-field"><label>软件路径（留空自动识别）</label><input id="cfg-exe" placeholder="D:\Program\StarSky\StarSky.exe"></div>
      <div class="field"><label>自动启动</label><select id="cfg-autostart"><option value="1">是</option><option value="0">否</option></select></div>
      <div class="field"><label>等待超时（秒）</label><input id="cfg-wait" type="number" min="5" max="300"></div>
      <div class="field"><label>签到后关闭软件</label><select id="cfg-close"><option value="1">是</option><option value="0">否</option></select></div>
    </div>
    <div class="actions" style="margin-top:12px">
      <button id="btn-save" class="primary">保存配置</button>
      <button id="btn-run" disabled>立即签到</button>
      <button id="btn-stop" class="danger" disabled>停止</button>
      <span class="note" id="mode-note" style="margin:0">读取本地登录态后台签到，无需打开 StarSky</span>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section>
    <h3>每日自动签到</h3>
    <div class="actions">
      <input class="time" id="sched-time" type="time" value="09:30">
      <button id="btn-sched">创建 / 更新任务</button>
      <button id="btn-unsched" class="danger">删除任务</button>
      <span class="note" style="margin:0">任务以最高权限运行；创建/删除时会弹 UAC 授权</span>
    </div>
  </section>

  <div class="warn-box" id="mode-help">
    后台签到需要本机已安装 StarSky 并登录过一次。登录失效时，请打开客户端重新登录。
  </div>

  <section class="log-card">
    <div class="log-head"><b>签到日志</b><button class="small" id="btn-refresh">刷新</button></div>
    <div class="log" id="log"><div class="empty">暂无日志</div></div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
let running = false;
let timer = null;
let savedMode = 'api';

function fmtTs(sec) {
  if (!sec) return '—';
  const d = new Date(sec * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function showErr(msg) { $('#err').textContent = msg || ''; }

async function jget(url) {
  const r = await fetch(url, { cache: 'no-store' });
  return r.json();
}
async function jpost(url, body, method = 'POST') {
  const opt = { method, cache: 'no-store' };
  if (body !== undefined) {
    opt.headers = { 'Content-Type': 'application/json' };
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(url, opt);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok && !data.error) data.error = `HTTP ${r.status}`;
  return data;
}

function fillConfig(cfg) {
  if (document.activeElement && document.activeElement.closest('.form')) return;
  $('#cfg-mode').value = cfg['签到方式'] === 'desktop' ? 'desktop' : 'api';
  $('#cfg-exe').value = cfg['软件路径'] || '';
  $('#cfg-autostart').value = cfg['自动启动'] || '1';
  $('#cfg-wait').value = cfg['等待超时'] || '30';
  $('#cfg-close').value = cfg['签到后关闭软件'] || '1';
  updateModeHelp();
}

function updateModeHelp() {
  const desktop = $('#cfg-mode').value === 'desktop';
  $('#cfg-autostart').disabled = !desktop;
  $('#cfg-close').disabled = !desktop;
  $('#mode-note').textContent = desktop ? '签到期间会抢占鼠标和前台窗口' : '读取本地登录态后台签到，无需打开 StarSky';
  $('#mode-help').textContent = desktop
    ? '窗口点击需要 StarSky 已登录、桌面解锁、窗口未被遮挡。执行时会移动鼠标，可能请求 UAC 管理员授权。'
    : '后台签到需要本机已安装 StarSky 并登录过一次。登录失效时，请打开客户端重新登录。';
}

function renderLog(lines) {
  const box = $('#log');
  box.innerHTML = '';
  if (!lines || !lines.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '暂无日志';
    box.appendChild(d);
    return;
  }
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  for (const line of lines) {
    const d = document.createElement('div');
    if (/失败|错误|无法|未找到/.test(line)) d.className = 'bad';
    else if (/完成|已签到|成功|到账/.test(line)) d.className = 'ok';
    d.textContent = line;
    box.appendChild(d);
  }
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

function render(d) {
  savedMode = (d.config || {})['签到方式'] === 'desktop' ? 'desktop' : 'api';
  const admin = $('#admin-pill');
  admin.textContent = d.admin ? '管理员' : '普通权限';
  admin.className = 'pill ' + (d.admin || savedMode === 'api' ? 'ok' : 'warn');

  const task = d.task || {};
  const info = task.info || {};
  const tp = $('#task-pill');
  tp.textContent = task.exists ? '计划任务已建' : '无计划任务';
  tp.className = 'pill ' + (task.exists ? 'ok' : '');
  $('#task-state').textContent = task.exists ? (info['状态'] || '已创建') : '未创建';
  $('#task-next').textContent = info['下次运行时间'] || '—';
  $('#exe-state').textContent = d.exe_exists ? '已找到' : ((d.config || {})['软件路径'] || '未配置');

  fillConfig(d.config || {});

  const st = d.state || {};
  running = !!st.running;
  const rp = $('#run-pill');
  rp.textContent = running ? '运行中' : '空闲';
  rp.className = 'pill ' + (running ? 'warn' : '');
  $('#run-via').textContent = st.via === 'task' ? '计划任务' : (st.via === 'direct' ? '直接运行' : '—');
  $('#run-start').textContent = fmtTs(st.started_at);
  $('#run-code').textContent = st.exit_code == null ? '—' : st.exit_code;
  $('#btn-stop').disabled = !running || st.via !== 'direct';
  $('#btn-run').disabled = running;

  $('#log-time').textContent = fmtTs(d.log_mtime);
  $('#last-line').textContent = d.last_line || '—';
  renderLog(d.log_tail || []);
}

async function refresh() {
  try {
    const d = await jget('/starsky/api/status');
    if (d.ok) render(d);
  } catch (e) {
    showErr('无法连接后端');
  }
  clearTimeout(timer);
  timer = setTimeout(refresh, running ? 2500 : 6000);
}

async function act(promise, okMsg) {
  showErr('');
  try {
    const r = await promise;
    if (r && r.ok === false) { showErr(r.error || '操作失败'); return null; }
    if (okMsg) showErr('');
    await refresh();
    return r;
  } catch (e) {
    showErr('请求失败');
    return null;
  }
}

$('#btn-save').addEventListener('click', () => act(jpost('/starsky/api/config', {
  '签到方式': $('#cfg-mode').value,
  '软件路径': $('#cfg-exe').value,
  '自动启动': $('#cfg-autostart').value,
  '等待超时': $('#cfg-wait').value,
  '签到后关闭软件': $('#cfg-close').value,
}), '已保存'));

$('#btn-run').addEventListener('click', () => {
  if (savedMode === 'desktop' && !confirm('签到会抢占鼠标和前台窗口，并可能关闭 StarSky。继续？')) return;
  act(jpost('/starsky/api/run'));
});
$('#btn-stop').addEventListener('click', () => act(jpost('/starsky/api/stop')));

async function scheduleAct(btn, request) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '处理中…';
  try {
    await act(request());
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

$('#btn-sched').addEventListener('click', () => {
  const at = $('#sched-time').value;
  if (!at) { showErr('请选择时间'); return; }
  scheduleAct($('#btn-sched'), () => jpost('/starsky/api/schedule', { time: at }));
});
$('#btn-unsched').addEventListener('click', () => {
  if (!confirm('确定删除计划任务「StarSky自动签到」？')) return;
  scheduleAct($('#btn-unsched'), () => jpost('/starsky/api/schedule', undefined, 'DELETE'));
});
$('#btn-refresh').addEventListener('click', refresh);
$('#cfg-mode').addEventListener('change', updateModeHelp);

refresh();
</script>
<script src="/back.js" defer></script>
</body>
</html>
