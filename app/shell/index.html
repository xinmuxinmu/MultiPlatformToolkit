<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多平台工具</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f6fa; color: #1f2937; overflow: hidden;
  }
  .app-shell { display: flex; height: 100vh; }

  /* ── 左侧软件栏 ── */
  .sidebar {
    width: 236px; flex: none; display: flex; flex-direction: column;
    background: #fff; border-right: 1px solid #e6e9f2; padding: 18px 12px 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34,197,94,.15); flex: none;
  }
  .brand b { font-size: 17px; letter-spacing: -.2px; }
  .brand small { display: block; font-size: 11px; color: #94a3b8; font-weight: 400; margin-top: 2px; }

  .nav { display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    border: 1px solid transparent; background: transparent; border-radius: 11px;
    padding: 10px 11px; cursor: pointer; text-align: left; color: #334155;
    font: inherit; transition: .15s;
  }
  .nav-item:hover { background: #f6f8fc; border-color: #e6eaf2; }
  .nav-item.active { background: #eef4ff; border-color: #c9dcff; color: #1d4ed8; }
  .nav-item .ico {
    width: 34px; height: 34px; flex: none; border-radius: 9px; display: grid;
    place-items: center; font-size: 17px; background: #f1f5f9;
  }
  .nav-item.active .ico { background: #fff; box-shadow: 0 1px 4px rgba(37,99,235,.12); }
  .nav-item .txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .nav-item .txt b { font-size: 13.5px; font-weight: 650; }
  .nav-item .txt small {
    font-size: 11px; color: #94a3b8; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-item.active .txt small { color: #6b8fd6; }

  .side-foot {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid #eef1f6;
    font-size: 11px; color: #a0a8b6; line-height: 1.7;
  }
  .side-foot .mono { font-family: ui-monospace, Consolas, monospace; color: #94a3b8; }
  .headless-switch {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    color: #64748b; cursor: pointer; user-select: none; margin-bottom: 3px;
  }
  .headless-switch input { accent-color: #2563eb; }
  .headless-hint { font-size: 10.5px; color: #b0b8c4; line-height: 1.5; margin-bottom: 8px; }

  /* ── 右侧应用区 ── */
  .stage { flex: 1; min-width: 0; position: relative; background: #fff; }
  .app-frame {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #fff; display: none;
  }
  .app-frame.active { display: block; }

  /* ── 外观偏好（全局主题 / 语言 / 无头） ── */
  .prefs { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .theme-dots { display: flex; gap: 6px; }
  .theme-dots button {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0; flex: none;
  }
  .theme-dots button[data-theme="dark"] { background: #1a1a2e; }
  .theme-dots button[data-theme="light"] { background: #f7f7f9; border-color: #d0d7de; }
  .theme-dots button[data-theme="ocean"] { background: #35c0d6; }
  .theme-dots button[data-theme="purple"] { background: #b57cff; }
  .theme-dots button.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #2563eb; }
  .lang-switch { display: flex; gap: 2px; background: #f1f3f9; padding: 2px; border-radius: 6px; }
  .lang-switch button {
    border: 0; background: transparent; color: #64748b; font: 600 10.5px/1 inherit;
    padding: 3px 6px; border-radius: 4px; cursor: pointer;
  }
  .lang-switch button.active { background: #fff; color: #2563eb; box-shadow: 0 1px 2px rgba(16,24,40,.12); }

  /* 四种主题：暗 / 亮 / 海蓝 / 紫夜 */
  html[data-theme="dark"] body { background: #0f172a; color: #e5e7eb; }
  html[data-theme="dark"] .sidebar { background: #111827; border-right-color: #24304a; }
  html[data-theme="dark"] .brand b { color: #e5e7eb; }
  html[data-theme="dark"] .brand small { color: #94a3b8; }
  html[data-theme="dark"] .nav-item { color: #cbd5e1; }
  html[data-theme="dark"] .nav-item:hover { background: #182238; border-color: #24304a; }
  html[data-theme="dark"] .nav-item.active { background: #1e2a44; border-color: #3b82f6; color: #93c5fd; }
  html[data-theme="dark"] .nav-item .ico { background: #1f2937; }
  html[data-theme="dark"] .nav-item.active .ico { background: #111827; }
  html[data-theme="dark"] .nav-item .txt small { color: #94a3b8; }
  html[data-theme="dark"] .nav-item.active .txt small { color: #93c5fd; }
  html[data-theme="dark"] .side-foot { border-top-color: #24304a; color: #94a3b8; }
  html[data-theme="dark"] .headless-switch { color: #cbd5e1; }
  html[data-theme="dark"] .headless-hint { color: #94a3b8; }
  html[data-theme="dark"] .lang-switch { background: #1f2937; }
  html[data-theme="dark"] .lang-switch button.active { background: #111827; color: #93c5fd; }
  html[data-theme="dark"] .theme-dots button.active { box-shadow: 0 0 0 2px #111827, 0 0 0 4px #60a5fa; }
  html[data-theme="dark"] .stage { background: #0f172a; }

  html[data-theme="ocean"] body { background: #062a36; color: #e0f2fe; }
  html[data-theme="ocean"] .sidebar { background: #083b4a; border-right-color: #0f5266; }
  html[data-theme="ocean"] .brand b { color: #e0f2fe; }
  html[data-theme="ocean"] .brand small { color: #7dd3fc; }
  html[data-theme="ocean"] .nav-item { color: #bae6fd; }
  html[data-theme="ocean"] .nav-item:hover { background: #0b4757; border-color: #0f5266; }
  html[data-theme="ocean"] .nav-item.active { background: #0e5a6e; border-color: #22d3ee; color: #a5f3fc; }
  html[data-theme="ocean"] .nav-item .ico { background: #0b4757; }
  html[data-theme="ocean"] .nav-item.active .ico { background: #083b4a; }
  html[data-theme="ocean"] .nav-item .txt small { color: #7dd3fc; }
  html[data-theme="ocean"] .nav-item.active .txt small { color: #a5f3fc; }
  html[data-theme="ocean"] .side-foot { border-top-color: #0f5266; color: #7dd3fc; }
  html[data-theme="ocean"] .headless-switch { color: #bae6fd; }
  html[data-theme="ocean"] .headless-hint { color: #7dd3fc; }
  html[data-theme="ocean"] .lang-switch { background: #0b4757; }
  html[data-theme="ocean"] .lang-switch button.active { background: #083b4a; color: #a5f3fc; }
  html[data-theme="ocean"] .theme-dots button.active { box-shadow: 0 0 0 2px #083b4a, 0 0 0 4px #22d3ee; }
  html[data-theme="ocean"] .stage { background: #062a36; }

  html[data-theme="purple"] body { background: #1b1229; color: #f3e8ff; }
  html[data-theme="purple"] .sidebar { background: #241735; border-right-color: #3b2a4e; }
  html[data-theme="purple"] .brand b { color: #f3e8ff; }
  html[data-theme="purple"] .brand small { color: #c4b5fd; }
  html[data-theme="purple"] .nav-item { color: #ddd6fe; }
  html[data-theme="purple"] .nav-item:hover { background: #2f1f46; border-color: #3b2a4e; }
  html[data-theme="purple"] .nav-item.active { background: #3a2758; border-color: #a855f7; color: #e9d5ff; }
  html[data-theme="purple"] .nav-item .ico { background: #2f1f46; }
  html[data-theme="purple"] .nav-item.active .ico { background: #241735; }
  html[data-theme="purple"] .nav-item .txt small { color: #c4b5fd; }
  html[data-theme="purple"] .nav-item.active .txt small { color: #e9d5ff; }
  html[data-theme="purple"] .side-foot { border-top-color: #3b2a4e; color: #c4b5fd; }
  html[data-theme="purple"] .headless-switch { color: #ddd6fe; }
  html[data-theme="purple"] .headless-hint { color: #c4b5fd; }
  html[data-theme="purple"] .lang-switch { background: #2f1f46; }
  html[data-theme="purple"] .lang-switch button.active { background: #241735; color: #e9d5ff; }
  html[data-theme="purple"] .theme-dots button.active { box-shadow: 0 0 0 2px #241735, 0 0 0 4px #c084fc; }
  html[data-theme="purple"] .stage { background: #1b1229; }

  @media (max-width: 820px) {
    .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; padding: 8px 10px; gap: 8px; border-right: 0; border-bottom: 1px solid #e6e9f2; }
    .brand { display: none; }
    .nav { flex-direction: row; flex: 1; overflow-x: auto; gap: 4px; }
    .nav-item { width: auto; flex: none; padding: 7px 9px; }
    .nav-item .txt small { display: none; }
    .nav-item .ico { width: 26px; height: 26px; font-size: 14px; }
    .side-foot { display: none; }
    .app-shell { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <div><b data-i18n="brandName">多平台工具</b><small data-i18n="brandSub">聊天记录 · 签到 · 火花</small></div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" type="button" data-app="douyin">
        <span class="ico">🎵</span>
        <span class="txt"><b data-i18n="appDouyin">抖音</b><small data-i18n="appDouyinSub">聊天记录 · 火花</small></span>
      </button>
      <button class="nav-item" type="button" data-app="weibo">
        <span class="ico">💬</span>
        <span class="txt"><b data-i18n="appWeibo">微博聊天记录</b><small data-i18n="appWeiboSub">私信导出 · 离线浏览</small></span>
      </button>
      <button class="nav-item" type="button" data-app="taobao">
        <span class="ico">🛒</span>
        <span class="txt"><b data-i18n="appTaobao">淘宝旺旺记录</b><small data-i18n="appTaobaoSub">买家侧聊天导出</small></span>
      </button>
      <button class="nav-item" type="button" data-app="signin">
        <span class="ico">✅</span>
        <span class="txt"><b data-i18n="appSignin">一键签到</b><small data-i18n="appSigninSub">微博 / 贴吧 / 吾爱 / StarSky</small></span>
      </button>
    </nav>
    <div class="side-foot">
      <div class="prefs">
        <div class="theme-dots" id="themeDots" aria-label="主题">
          <button type="button" data-theme="dark" title="黑色 / Dark"></button>
          <button type="button" data-theme="light" title="白色 / Light"></button>
          <button type="button" data-theme="ocean" title="蓝色 / Ocean"></button>
          <button type="button" data-theme="purple" title="紫色 / Purple"></button>
        </div>
        <div class="lang-switch" id="langSwitch" aria-label="语言">
          <button type="button" data-lang="zh">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <label class="headless-switch" title="导出/火花初始化使用无头浏览器；扫码登录仍会弹窗">
        <input type="checkbox" id="headlessToggle"> <span data-i18n="headless">无头模式</span>
      </label>
      <div class="headless-hint" id="headlessHint" data-i18n="headlessHint">导出/初始化不弹浏览器窗口</div>
      <span data-i18n="localRun">全部在本机运行</span><br>
      <span class="mono" id="host">127.0.0.1:18000</span>
    </div>
  </aside>

  <main class="stage" id="stage"></main>
</div>

<script>
(function () {
  'use strict';

  var APPS = {
    douyin: { name: '抖音', url: '/douyin?embed=1' },
    weibo:  { name: '微博聊天记录', url: '/weibo-chat/?embed=1' },
    taobao: { name: '淘宝旺旺记录', url: '/taobao/?embed=1' },
    signin: { name: '一键签到', url: '/signin/?embed=1' },
    starsky:{ name: '一键签到', url: '/signin/?embed=1#starsky' }
  };
  var frames = {};
  var current = '';

  function withCache(url) {
    var hash = '';
    var i = url.indexOf('#');
    if (i >= 0) { hash = url.slice(i); url = url.slice(0, i); }
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now() + hash;
  }

  var nav = document.getElementById('nav');
  var stage = document.getElementById('stage');
  document.getElementById('host').textContent = location.host;

  // 内嵌页面里的“返回首页”不再跳出应用（会变成壳套壳），直接隐藏/拦截
  function sanitizeFrame(frame) {
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      doc.querySelectorAll('a[href="/"], a[href="./"], a[href=""]').forEach(function (a) {
        if (/返回首页|返回/.test(a.textContent || '')) a.style.display = 'none';
      });
      doc.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (href === '/' || href === './') e.preventDefault();
      }, true);
    } catch (e) { /* 跨域或页面未就绪时忽略 */ }
  }

  function loadApp(key, updateHash) {
    if (!APPS[key]) key = 'douyin';
    current = key;

    if (!frames[key]) {
      var frame = document.createElement('iframe');
      frame.className = 'app-frame';
      frame.title = APPS[key].name;
      frame.src = withCache(APPS[key].url);
      frame.addEventListener('load', function () { sanitizeFrame(frame); broadcastTo(frame); });
      frames[key] = frame;
      stage.appendChild(frame);
    }

    Object.keys(frames).forEach(function (k) {
      frames[k].classList.toggle('active', k === key);
    });
    var navKey = key === 'starsky' ? 'signin' : key;
    nav.querySelectorAll('.nav-item').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-app') === navKey);
    });
    document.title = '多平台工具 · ' + APPS[key].name;
    try { localStorage.setItem('mp-app', navKey); } catch (e) {}
    if (updateHash) history.replaceState(null, '', '#' + key);
  }

  nav.addEventListener('click', function (e) {
    var btn = e.target.closest('.nav-item');
    if (!btn) return;
    loadApp(btn.getAttribute('data-app'), true);
  });

  window.addEventListener('hashchange', function () {
    var key = (location.hash || '').replace(/^#/, '');
    if (key && key !== current) loadApp(key, false);
  });

  var I18N = {
    zh: {
      brandName: '多平台工具', brandSub: '聊天记录 · 签到 · 火花',
      appDouyin: '抖音', appDouyinSub: '聊天记录 · 火花',
      appWeibo: '微博聊天记录', appWeiboSub: '私信导出 · 离线浏览',
      appTaobao: '淘宝旺旺记录', appTaobaoSub: '买家侧聊天导出',
      appSignin: '一键签到', appSigninSub: '微博 / 贴吧 / 吾爱 / StarSky',
      headless: '无头模式', headlessHint: '导出/初始化不弹浏览器窗口',
      headlessOn: '已开启：下次导出/初始化不弹窗口',
      headlessOff: '已关闭：下次导出/初始化显示浏览器',
      localRun: '全部在本机运行',
    },
    en: {
      brandName: 'Multi-tool', brandSub: 'Chats · Check-in · Spark',
      appDouyin: 'Douyin', appDouyinSub: 'Chats · Spark',
      appWeibo: 'Weibo Chats', appWeiboSub: 'Export · Offline viewer',
      appTaobao: 'Taobao Chats', appTaobaoSub: 'Buyer chat export',
      appSignin: 'Daily Check-in', appSigninSub: 'Weibo / Tieba / 52pojie / StarSky',
      headless: 'Headless', headlessHint: 'Run exports/init without a browser window',
      headlessOn: 'On: next export/init runs without a window',
      headlessOff: 'Off: next export/init shows the browser',
      localRun: 'Runs entirely on this machine',
    },
  };
  var headlessToggle = document.getElementById('headlessToggle');
  var headlessHint = document.getElementById('headlessHint');
  var themeDots = document.getElementById('themeDots');
  var langSwitch = document.getElementById('langSwitch');
  var currentTheme = 'dark';
  var currentLang = 'zh';

  function updateHeadlessHint() {
    headlessHint.textContent = I18N[currentLang][headlessToggle.checked ? 'headlessOn' : 'headlessOff'];
  }

  function applyTheme(theme) {
    currentTheme = theme || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    if (themeDots) {
      themeDots.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-theme') === currentTheme);
      });
    }
  }

  function applyLang(lang) {
    currentLang = I18N[lang] ? lang : 'zh';
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var text = I18N[currentLang][el.getAttribute('data-i18n')];
      if (text) el.textContent = text;
    });
    if (langSwitch) {
      langSwitch.querySelectorAll('button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
      });
    }
    updateHeadlessHint();
  }

  function broadcastTo(frame) {
    try {
      frame.contentWindow.postMessage(
        { type: 'mp:settings', theme: currentTheme, lang: currentLang },
        location.origin
      );
    } catch (e) { /* iframe not ready */ }
  }

  function broadcast() {
    document.querySelectorAll('.app-frame').forEach(broadcastTo);
  }

  function savePreference(patch) {
    fetch('/api/ui/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch),
    }).catch(function () {});
  }

  if (themeDots) {
    themeDots.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-theme]');
      if (!btn) return;
      applyTheme(btn.getAttribute('data-theme'));
      savePreference({ theme: currentTheme });
      broadcast();
    });
  }
  if (langSwitch) {
    langSwitch.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-lang]');
      if (!btn) return;
      applyLang(btn.getAttribute('data-lang'));
      savePreference({ lang: currentLang });
      broadcast();
    });
  }
  headlessToggle.addEventListener('change', function () {
    savePreference({ headless: headlessToggle.checked });
    updateHeadlessHint();
  });

  fetch('/api/ui/settings').then(function (r) { return r.json(); }).then(function (s) {
    applyTheme(s.theme || 'light');
    applyLang(s.lang || 'zh');
    headlessToggle.checked = !!s.headless;
    updateHeadlessHint();
  }).catch(function () { applyTheme('dark'); applyLang('zh'); });

  var initial = (location.hash || '').replace(/^#/, '');
  if (!APPS[initial]) {
    try { initial = localStorage.getItem('mp-app') || 'douyin'; } catch (e) { initial = 'douyin'; }
  }
  loadApp(initial, true);
})();
</script>
</body>
</html>
