<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多平台工具</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f6fa; color: #1f2937; overflow: hidden;
  }
  .app-shell { display: flex; height: 100vh; }

  /* ── 左侧软件栏 ── */
  .sidebar {
    width: 236px; flex: none; display: flex; flex-direction: column;
    background: #fff; border-right: 1px solid #e6e9f2; padding: 18px 12px 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34,197,94,.15); flex: none;
  }
  .brand b { font-size: 17px; letter-spacing: -.2px; }
  .brand small { display: block; font-size: 11px; color: #94a3b8; font-weight: 400; margin-top: 2px; }

  .nav { display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    border: 1px solid transparent; background: transparent; border-radius: 11px;
    padding: 10px 11px; cursor: pointer; text-align: left; color: #334155;
    font: inherit; transition: .15s;
  }
  .nav-item:hover { background: #f6f8fc; border-color: #e6eaf2; }
  .nav-item.active { background: #eef4ff; border-color: #c9dcff; color: #1d4ed8; }
  .nav-item .ico {
    width: 34px; height: 34px; flex: none; border-radius: 9px; display: grid;
    place-items: center; font-size: 17px; background: #f1f5f9;
  }
  .nav-item.active .ico { background: #fff; box-shadow: 0 1px 4px rgba(37,99,235,.12); }
  .nav-item .txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .nav-item .txt b { font-size: 13.5px; font-weight: 650; }
  .nav-item .txt small {
    font-size: 11px; color: #94a3b8; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-item.active .txt small { color: #6b8fd6; }

  .side-foot {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid #eef1f6;
    font-size: 11px; color: #a0a8b6; line-height: 1.7;
  }
  .side-foot .mono { font-family: ui-monospace, Consolas, monospace; color: #94a3b8; }

  /* ── 右侧应用区 ── */
  .stage { flex: 1; min-width: 0; position: relative; background: #fff; }
  .app-frame {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #fff; display: none;
  }
  .app-frame.active { display: block; }

  @media (max-width: 820px) {
    .sidebar { width: 100%; height: auto; flex-direction: row; align-items: center; padding: 8px 10px; gap: 8px; border-right: 0; border-bottom: 1px solid #e6e9f2; }
    .brand { display: none; }
    .nav { flex-direction: row; flex: 1; overflow-x: auto; gap: 4px; }
    .nav-item { width: auto; flex: none; padding: 7px 9px; }
    .nav-item .txt small { display: none; }
    .nav-item .ico { width: 26px; height: 26px; font-size: 14px; }
    .side-foot { display: none; }
    .app-shell { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <div><b>多平台工具</b><small>聊天记录 · 签到 · 火花</small></div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" type="button" data-app="douyin">
        <span class="ico">🎵</span>
        <span class="txt"><b>抖音</b><small>聊天记录 · 火花</small></span>
      </button>
      <button class="nav-item" type="button" data-app="weibo">
        <span class="ico">💬</span>
        <span class="txt"><b>微博聊天记录</b><small>私信导出 · 离线浏览</small></span>
      </button>
      <button class="nav-item" type="button" data-app="taobao">
        <span class="ico">🛒</span>
        <span class="txt"><b>淘宝旺旺记录</b><small>买家侧聊天导出</small></span>
      </button>
      <button class="nav-item" type="button" data-app="signin">
        <span class="ico">✅</span>
        <span class="txt"><b>一键签到</b><small>微博 / 贴吧 / 吾爱</small></span>
      </button>
      <button class="nav-item" type="button" data-app="starsky">
        <span class="ico">⭐</span>
        <span class="txt"><b>StarSky 签到</b><small>窗口自动点击</small></span>
      </button>
    </nav>
    <div class="side-foot">
      全部在本机运行<br>
      <span class="mono" id="host">127.0.0.1:18000</span>
    </div>
  </aside>

  <main class="stage" id="stage"></main>
</div>

<script>
(function () {
  'use strict';

  var APPS = {
    douyin: { name: '抖音', url: '/douyin?embed=1' },
    weibo:  { name: '微博聊天记录', url: '/weibo-chat/?embed=1' },
    taobao: { name: '淘宝旺旺记录', url: '/taobao/?embed=1' },
    signin: { name: '一键签到', url: '/signin/?embed=1' },
    starsky:{ name: 'StarSky 签到', url: '/starsky/?embed=1' }
  };
  var frames = {};
  var current = '';

  var nav = document.getElementById('nav');
  var stage = document.getElementById('stage');
  document.getElementById('host').textContent = location.host;

  // 内嵌页面里的“返回首页”不再跳出应用（会变成壳套壳），直接隐藏/拦截
  function sanitizeFrame(frame) {
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      doc.querySelectorAll('a[href="/"], a[href="./"], a[href=""]').forEach(function (a) {
        if (/返回首页|返回/.test(a.textContent || '')) a.style.display = 'none';
      });
      doc.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (href === '/' || href === './') e.preventDefault();
      }, true);
    } catch (e) { /* 跨域或页面未就绪时忽略 */ }
  }

  function loadApp(key, updateHash) {
    if (!APPS[key]) key = 'douyin';
    current = key;

    if (!frames[key]) {
      var frame = document.createElement('iframe');
      frame.className = 'app-frame';
      frame.title = APPS[key].name;
      frame.src = APPS[key].url + '&v=' + Date.now();
      frame.addEventListener('load', function () { sanitizeFrame(frame); });
      frames[key] = frame;
      stage.appendChild(frame);
    }

    Object.keys(frames).forEach(function (k) {
      frames[k].classList.toggle('active', k === key);
    });
    nav.querySelectorAll('.nav-item').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-app') === key);
    });
    document.title = '多平台工具 · ' + APPS[key].name;
    try { localStorage.setItem('mp-app', key); } catch (e) {}
    if (updateHash) history.replaceState(null, '', '#' + key);
  }

  nav.addEventListener('click', function (e) {
    var btn = e.target.closest('.nav-item');
    if (!btn) return;
    loadApp(btn.getAttribute('data-app'), true);
  });

  window.addEventListener('hashchange', function () {
    var key = (location.hash || '').replace(/^#/, '');
    if (key && key !== current) loadApp(key, false);
  });

  var initial = (location.hash || '').replace(/^#/, '');
  if (!APPS[initial]) {
    try { initial = localStorage.getItem('mp-app') || 'douyin'; } catch (e) { initial = 'douyin'; }
  }
  loadApp(initial, true);
})();
</script>
</body>
</html>
