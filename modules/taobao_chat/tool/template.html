<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>淘宝聊天记录</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brand:#ff5000; --brand-soft:#fff3ec; --bg:#f2f3f5; --panel:#fff;
    --line:#ebedf0; --text:#1f2329; --sub:#8a919b; --self:#ff5000;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; overflow:hidden;
  }
  .app{display:flex; height:100vh; max-width:1400px; margin:0 auto; background:var(--panel); box-shadow:0 0 40px rgba(0,0,0,.06)}
  /* ---------- sidebar ---------- */
  .side{width:310px; flex:0 0 310px; border-right:1px solid var(--line); display:flex; flex-direction:column; background:#fafbfc}
  .me{padding:16px 16px 12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line)}
  .me img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee}
  .me .ava-fallback{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
  .me .n{font-weight:600;font-size:14px}
  .me .s{font-size:12px;color:var(--sub);margin-top:2px}
  .search{padding:10px 12px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:18px;background:#fff;font-size:13px;outline:none;font-family:inherit}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,80,0,.12)}
  .list{flex:1;overflow-y:auto;padding:6px 0}
  .conv{display:flex;gap:10px;padding:10px 14px;cursor:pointer;align-items:center;border-left:3px solid transparent}
  .conv:hover{background:#f2f4f6}
  .conv.on{background:var(--brand-soft);border-left-color:var(--brand)}
  .conv img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 40px;background:#e8eaed}
  .conv .ava-fallback{width:40px;height:40px;border-radius:50%;background:#ffe1d1;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 40px}
  .conv .body{flex:1;min-width:0}
  .conv .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .conv .nm{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .tm{font-size:11px;color:var(--sub);flex:0 0 auto}
  .conv .pv{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  .head{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
  .head .h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
  .head .h1 span{font-size:12px;color:var(--sub);font-weight:400}
  .btns{display:flex;gap:8px;flex:0 0 auto}
  button{font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:#495057;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--brand);color:var(--brand)}
  .msgs{flex:1;overflow-y:auto;padding:20px 24px 40px;scroll-behavior:smooth}
  .empty{height:100%;display:flex;align-items:center;justify-content:center;color:#b6bcc4;font-size:13px}
  .day{text-align:center;margin:18px 0 14px}
  .day span{font-size:11.5px;color:#9aa2ac;background:#f4f5f7;padding:3px 10px;border-radius:10px}
  .row{display:flex;gap:9px;margin-bottom:14px;align-items:flex-start}
  .row.self{flex-direction:row-reverse}
  .row img.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 34px;background:#e8eaed;margin-top:2px}
  .row .av.ava-fallback{width:34px;height:34px;border-radius:50%;background:#ffe1d1;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 34px;margin-top:2px}
  .row .col{max-width:min(620px,68%);display:flex;flex-direction:column}
  .row.self .col{align-items:flex-end}
  .who{font-size:11.5px;color:#9aa2ac;margin:0 4px 4px}
  .bub{padding:9px 13px;border-radius:10px;line-height:1.62;word-break:break-word;white-space:pre-wrap;font-size:14px;background:#f4f5f7;color:#1f2329}
  .row.self .bub{background:var(--brand);color:#fff}
  .bub a{color:#ff5000;text-decoration:none}
  .row.self .bub a{color:#fff;text-decoration:underline}
  .bub img.pic{max-width:230px;max-height:360px;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in;background:#eee;object-fit:cover}
  .bub audio.voice{display:block;margin-top:4px;height:34px;max-width:250px}
  .bub video.vid{max-width:330px;max-height:250px;border-radius:8px;display:block;margin-top:6px;background:#000}
  .bub a.rawfile{display:inline-block;font-size:11px;margin-top:5px;opacity:.65}
  .row.self .bub a.rawfile{color:#fff}
  .recall{font-size:12px;color:#a8aeb6;font-style:italic;padding:6px 12px;background:#f7f8f9;border-radius:8px}
  .res{padding:12px 20px;border-bottom:1px solid #f2f3f5;cursor:pointer}
  .res:hover{background:#fafbfc}
  .res .rm{font-size:11.5px;color:var(--sub);margin-bottom:4px}
  .res .rt{font-size:13.5px;line-height:1.55}
  .res mark{background:#ffe9b8;color:#8a5a00;padding:0 1px;border-radius:2px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
  .lightbox.on{display:flex}
  .lightbox img{max-width:92vw;max-height:92vh;border-radius:4px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d5d9de;border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#c0c6cd;background-clip:content-box;border:2px solid transparent}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="me">
      <div class="ava-fallback" id="meAvaFallback">我</div>
      <img id="meAvatar" src="" alt="" style="display:none">
      <div><div class="n" id="meName">我</div><div class="s" id="meStat"></div></div>
    </div>
    <div class="search"><input id="q" placeholder="搜索全部聊天内容…" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main">
    <div class="head">
      <div class="h1" id="title">选择一个会话</div>
      <div class="btns">
        <button id="btnTxt">导出本会话</button>
        <button id="btnAll">导出全部文本</button>
      </div>
    </div>
    <div class="msgs" id="msgs"><div class="empty">← 从左侧选择一个会话查看聊天记录</div></div>
  </main>
</div>
<div class="lightbox" id="lb"><img id="lbi" src="" alt=""></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ME = DATA.me.uid;

$('meName').textContent = DATA.me.name || '我';
$('meStat').textContent = DATA.convs.length + ' 个会话 · ' + DATA.total.toLocaleString() + ' 条消息';
if (DATA.me.avatar) {
  $('meAvatar').src = DATA.me.avatar;
  $('meAvatar').style.display = '';
  $('meAvaFallback').style.display = 'none';
}

function fmtTime(ts){
  const d = new Date(ts), n = new Date();
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const sameDay = d.toDateString() === n.toDateString();
  if (sameDay) return hm;
  const md = (d.getMonth()+1)+'月'+d.getDate()+'日';
  if (d.getFullYear() === n.getFullYear()) return md+' '+hm;
  return d.getFullYear()+'年'+md+' '+hm;
}
function fmtDay(ts){
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return '今天';
  const y = new Date(n.getTime()-864e5);
  if (d.toDateString() === y.toDateString()) return '昨天';
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g, u => '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
}
function avatarHtml(src, name, cls){
  if (src) return '<img class="'+cls+'" src="'+esc(src)+'" loading="lazy" alt="">';
  return '<div class="'+cls+' ava-fallback">'+esc((name||'?').trim().charAt(0)||'?')+'</div>';
}

// 会话列表
const listEl = $('list');
DATA.convs.forEach((c, i) => {
  const last = c.messages[c.messages.length-1];
  const div = document.createElement('div');
  div.className = 'conv';
  div.dataset.i = i;
  div.innerHTML = avatarHtml(c.avatar, c.name, 'conv-ava')+
    '<div class="body"><div class="t"><span class="nm">'+esc(c.name)+'</span>'+
    '<span class="tm">'+(last?fmtTime(last.ts):'')+'</span></div>'+
    '<div class="pv">'+(last?esc((last.text||(last.pics&&last.pics.length?'[图片]':'')||'').replace(/\s+/g,' ').slice(0,42)):'暂无消息')+'</div></div>';
  div.onclick = () => openConv(i);
  listEl.appendChild(div);
});

let cur = -1;
function openConv(i){
  cur = i;
  document.querySelectorAll('.conv').forEach(e => e.classList.toggle('on', +e.dataset.i === i));
  const c = DATA.convs[i];
  $('title').innerHTML = esc(c.name)+' <span>'+c.count+' 条</span>';
  const box = $('msgs');
  if (!c.messages.length){ box.innerHTML = '<div class="empty">这个会话没有可导出的消息</div>'; return; }
  let h = '', prevTs = 0, prevDay = '';
  for (const m of c.messages){
    const day = fmtDay(m.ts);
    if (day !== prevDay){ h += '<div class="day"><span>'+day+'</span></div>'; prevDay = day; prevTs = 0; }
    else if (m.ts - prevTs > 5*60*1000){ h += '<div class="day"><span>'+fmtTime(m.ts)+'</span></div>'; }
    prevTs = m.ts;
    const self = m.from === ME;
    let inner = '';
    if (m.recall) inner = '<div class="recall">该消息已被撤回</div>';
    else {
      let body = '';
      if (m.text) body = linkify(m.text);
      if (m.pics && m.pics.length){
        body += m.pics.map(p => '<img class="pic" loading="lazy" src="'+esc(p)+'" onclick="zoom(this.src)">').join('');
      }
      if (m.audio){
        body += '<audio class="voice" controls preload="metadata" src="'+esc(m.audio)+'"></audio>';
        if (m.audioRaw) body += '<a class="rawfile" href="'+esc(m.audioRaw)+'" target="_blank" rel="noopener">原始语音文件</a>';
      }
      if (m.video) body += '<video class="vid" controls preload="metadata" src="'+esc(m.video)+'"></video>';
      if (!body) body = '<span style="color:#9aa2ac">[非文本消息]</span>';
      inner = '<div class="bub">'+body+'</div>';
    }
    h += '<div class="row'+(self?' self':'')+'">'+
      (self?'':avatarHtml(m.avatar, m.fromName, 'av'))+
      '<div class="col">'+(self?'':'<div class="who">'+esc(m.fromName||'')+'</div>')+inner+'</div></div>';
  }
  box.innerHTML = h;
  box.scrollTop = box.scrollHeight;
}

function zoom(src){ $('lbi').src = src; $('lb').classList.add('on'); }
$('lb').onclick = () => $('lb').classList.remove('on');

// 搜索
let timer;
$('q').oninput = (e) => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  timer = setTimeout(() => q ? doSearch(q) : (cur >= 0 ? openConv(cur) : $('msgs').innerHTML = '<div class="empty">← 从左侧选择一个会话查看聊天记录</div>'), 200);
};
function doSearch(q){
  const lq = q.toLowerCase();
  const hits = [];
  for (let ci = 0; ci < DATA.convs.length && hits.length < 300; ci++){
    const c = DATA.convs[ci];
    for (const m of c.messages){
      if ((m.text||'').toLowerCase().includes(lq)){ hits.push({ci, m, c}); if (hits.length >= 300) break; }
    }
  }
  $('title').innerHTML = '搜索 “'+esc(q)+'” <span>'+hits.length+' 条结果</span>';
  if (!hits.length){ $('msgs').innerHTML = '<div class="empty">没有找到匹配的消息</div>'; return; }
  const box = $('msgs');
  box.innerHTML = hits.map((h, k) => {
    const t = esc(h.m.text);
    const idx = t.toLowerCase().indexOf(esc(q).toLowerCase());
    const marked = idx >= 0 ? t.slice(0,idx)+'<mark>'+t.slice(idx,idx+esc(q).length)+'</mark>'+t.slice(idx+esc(q).length) : t;
    return '<div class="res" data-k="'+k+'"><div class="rm">'+esc(h.c.name)+' · '+fmtTime(h.m.ts)+'</div><div class="rt">'+marked+'</div></div>';
  }).join('');
  box.querySelectorAll('.res').forEach(el => {
    el.onclick = () => { openConv(hits[+el.dataset.k].ci); };
  });
  box.scrollTop = 0;
}

// 导出
function download(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function convToText(c){
  let out = '=== ' + c.name + ' ===\n共 ' + c.count + ' 条消息\n\n';
  let prevDay = '';
  for (const m of c.messages){
    const day = fmtDay(m.ts);
    if (day !== prevDay){ out += '\n---------- ' + day + ' ----------\n'; prevDay = day; }
    const who = m.from === ME ? '我' : (m.fromName || c.name);
    out += '[' + fmtTime(m.ts) + '] ' + who + '：' + (m.recall ? '[消息已撤回]' : (m.text || '[非文本消息]')) + '\n';
  }
  return out;
}
$('btnTxt').onclick = () => { if (cur < 0) return alert('请先选择一个会话'); download(DATA.convs[cur].name + '.txt', convToText(DATA.convs[cur])); };
$('btnAll').onclick = () => {
  let out = '淘宝聊天记录备份\n导出时间：' + DATA.exportedAt + '\n共 ' + DATA.convs.length + ' 个会话，' + DATA.total + ' 条消息\n';
  for (const c of DATA.convs){ if (c.count) out += '\n\n' + convToText(c); }
  download('淘宝聊天记录_全部.txt', out);
};
</script>
</body>
</html>
