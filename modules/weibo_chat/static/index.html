<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微博聊天记录导出</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:#f4f6fa;color:#1f2937;line-height:1.6;min-height:100vh;padding:28px 20px 48px}
.wrap{max-width:1020px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:21px;font-weight:650;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:#f97316;box-shadow:0 0 0 4px rgba(249,115,22,.15)}
.sub{font-size:12.5px;color:#8b95a5;margin-top:3px}
.links{display:flex;gap:14px;font-size:13px}
.links a{color:#2563eb;text-decoration:none;font-weight:600}
.links a.muted{color:#64748b;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #edf0f5;border-radius:14px;padding:16px 17px;
  box-shadow:0 1px 3px rgba(16,24,40,.04);min-height:132px;display:flex;flex-direction:column}
.card h2{font-size:12px;font-weight:650;color:#94a3b8;letter-spacing:.5px;margin-bottom:10px}
.big{font-size:20px;font-weight:650;letter-spacing:-.2px}
.muted{color:#8b95a5;font-size:12.5px}
.state{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.pill{font-size:11px;font-weight:650;padding:2px 9px;border-radius:20px;background:#f1f5f9;color:#64748b}
.pill.ok{background:#e8f9ef;color:#16a34a}
.pill.warn{background:#fff7ed;color:#c2410c}
.pill.err{background:#fef2f2;color:#dc2626}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:#8b95a5}
.kv span:last-child{color:#334155;font-weight:550;text-align:right;word-break:break-all}
section{margin-top:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-size:13.5px;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;
  border:1px solid #e2e8f0;background:#fff;color:#334155;transition:.15s}
button:hover:not(:disabled){border-color:#bfd3f9;color:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.08)}
button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
button.primary:hover:not(:disabled){background:#1d4ed8;color:#fff}
button.danger{color:#dc2626;border-color:#fecaca;background:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:5px 11px;font-size:12px}
.note{margin-top:10px;font-size:12px;color:#94a3b8}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#64748b;cursor:pointer;user-select:none}
.log-card{background:#0f172a;border-radius:14px;padding:14px 16px;border:1px solid #1e293b}
.log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-head b{font-size:12px;color:#94a3b8;letter-spacing:.5px;font-weight:650}
.log{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px;line-height:1.65;
  color:#cbd5e1;white-space:pre-wrap;word-break:break-all;height:340px;overflow:auto}
.log .err{color:#fca5a5}
.log .ok{color:#86efac}
.log .sys{color:#93c5fd}
.empty{color:#64748b;font-style:italic}
a.viewer{display:inline-flex;align-items:center;gap:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot"></span>微博聊天记录导出</h1>
      <div class="sub">私信文字、图片、语音、视频本地化，生成离线 HTML 浏览页</div>
    </div>
    <div class="links">
      <a href="/weibo-chat/viewer" target="_blank" class="viewer">打开浏览页 ↗</a>
      <a href="/" class="muted">返回首页</a>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>登录状态</h2>
      <div class="state"><span id="acct-dot" class="pill">未检测</span><span id="acct-name" class="muted">—</span></div>
      <div class="kv"><span>登录态文件</span><span id="state-file">—</span></div>
      <div class="kv"><span>检测时间</span><span id="acct-time">—</span></div>
      <div style="margin-top:auto;padding-top:10px">
        <button class="small" id="btn-check">检测登录状态</button>
      </div>
    </div>

    <div class="card">
      <h2>最近导出</h2>
      <div class="big" id="sum-conv">—</div>
      <div class="muted" id="sum-msg">还没有导出记录</div>
      <div class="kv" style="margin-top:8px"><span>导出时间</span><span id="sum-time">—</span></div>
      <div class="kv"><span>媒体文件</span><span id="sum-media">—</span></div>
      <div class="kv"><span>增量基线</span><span id="sum-inc">—</span></div>
    </div>

    <div class="card">
      <h2>当前任务</h2>
      <div class="state"><span id="task-pill" class="pill">空闲</span></div>
      <div class="kv" style="margin-top:6px"><span>启动时间</span><span id="task-start">—</span></div>
      <div class="kv"><span>退出码</span><span id="task-code">—</span></div>
      <div class="kv"><span>Node.js</span><span id="task-node">—</span></div>
    </div>
  </div>

  <section class="actions">
    <button id="btn-login">登录微博</button>
    <button class="primary" id="btn-run">开始导出</button>
    <button class="danger" id="btn-stop" disabled>停止</button>
    <label class="chk"><input type="checkbox" id="full"> 全量重建（不合并旧记录）</label>
  </section>
  <div class="note">首次使用先登录微博；默认增量导出只补新消息。导出会打开无头 Chrome 复用登录态，登录和导出期间请勿重复触发。</div>

  <section class="log-card">
    <div class="log-head"><b>运行日志</b><button class="small" id="btn-clear">清屏</button></div>
    <div class="log" id="log"><div class="empty">等待任务…</div></div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
let since = 0;
let polling = false;
let timer = null;

function fmtTs(sec) {
  if (!sec) return '—';
  const d = new Date(sec * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtAny(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return fmtTs(d.getTime() / 1000);
}
async function jget(url) {
  const r = await fetch(url, { cache: 'no-store' });
  return r.json();
}
async function jpost(url) {
  const r = await fetch(url, { method: 'POST' });
  return r.json();
}
function toast(msg) {
  if (!msg) return;
  const log = $('#log');
  const div = document.createElement('div');
  div.className = 'err';
  div.textContent = '[界面] ' + msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function loadSummary() {
  try {
    const d = await jget('/weibo-chat/api/summary');
    const s = d.data || {};
    $('#state-file').textContent = s.state_exists ? '已保存' : '无';
    $('#sum-conv').textContent = s.conversations != null ? `${s.conversations} 个会话` : '—';
    $('#sum-msg').textContent = s.messages != null ? `${s.messages} 条消息` : '还没有导出记录';
    $('#sum-time').textContent = fmtAny(s.exported_at);
    $('#sum-media').textContent = (s.images || 0) + (s.audio || 0) + (s.videos || 0) + ' 个';
    $('#sum-inc').textContent = s.incremental === true ? '可用' : (s.raw_mtime ? '需全量重建' : '—');
  } catch (e) {
    toast('读取概览失败');
  }
}

function renderTask(t) {
  const pill = $('#task-pill');
  const running = !!t.running;
  const labels = { export: '导出中', login: '登录中', full: '全量导出中' };
  pill.textContent = running ? (labels[t.kind] || '运行中') : (t.exit_code == null ? '空闲' : (t.exit_code === 0 ? '上次成功' : '上次失败'));
  pill.className = 'pill ' + (running ? 'warn' : (t.exit_code === 0 ? 'ok' : (t.exit_code == null ? '' : 'err')));
  $('#task-start').textContent = fmtTs(t.started_at);
  $('#task-code').textContent = t.exit_code == null ? '—' : t.exit_code;
  $('#task-node').textContent = t.node ? '已就绪' : '未安装';
  $('#btn-stop').disabled = !running;
  for (const id of ['btn-login', 'btn-run']) $('#' + id).disabled = running;
}

function appendLogs(items) {
  if (!items || !items.length) return;
  const log = $('#log');
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  for (const it of items) {
    const div = document.createElement('div');
    const line = it.line || '';
    if (/失败|错误|未找到|Error|error/.test(line)) div.className = 'err';
    else if (/成功|完成|✅/.test(line)) div.className = 'ok';
    else if (line.startsWith('$ ') || line.startsWith('[wrapper]')) div.className = 'sys';
    div.textContent = line;
    log.appendChild(div);
  }
  while (log.childElementCount > 1200) log.firstElementChild.remove();
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    while (true) {
      const d = await jget(`/weibo-chat/api/logs?since=${since}`);
      appendLogs(d.logs);
      since = (d.task && d.task.seq) || since;
      renderTask(d.task || {});
      if (!d.task || !d.task.running) break;
      await new Promise((r) => setTimeout(r, 1200));
    }
  } catch (e) {
    toast('日志轮询中断');
  } finally {
    polling = false;
    loadSummary();
  }
}

async function startTask(url, failMsg) {
  try {
    const r = await jpost(url);
    if (!r.ok) { toast(r.error || failMsg); return; }
    $('#log').innerHTML = '';
    since = 0;
    poll();
  } catch (e) {
    toast(failMsg);
  }
}

$('#btn-check').addEventListener('click', async (ev) => {
  const btn = ev.target;
  btn.disabled = true;
  btn.textContent = '检测中…';
  try {
    const r = await jget('/weibo-chat/api/account');
    const dot = $('#acct-dot');
    if (!r.ok) {
      dot.textContent = '检测失败';
      dot.className = 'pill err';
      toast(r.error);
    } else if (r.logged_in) {
      dot.textContent = '已登录';
      dot.className = 'pill ok';
      $('#acct-name').textContent = r.name || r.uid || '';
    } else {
      dot.textContent = '未登录';
      dot.className = 'pill err';
      $('#acct-name').textContent = r.note || '请扫码登录';
    }
    $('#acct-time').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    toast('检测登录状态失败');
  }
  btn.disabled = false;
  btn.textContent = '检测登录状态';
});

$('#btn-login').addEventListener('click', () => {
  if (!confirm('将打开有头 Chrome 窗口显示微博二维码，请在窗口内扫码。继续？')) return;
  startTask('/weibo-chat/api/login', '启动登录失败');
});
$('#btn-run').addEventListener('click', () => {
  const full = $('#full').checked;
  if (full && !confirm('全量重建会重新拉取所有会话（可长达数分钟），并替换已有记录，确定继续？')) return;
  startTask('/weibo-chat/api/run?mode=' + (full ? 'full' : 'incremental'), '启动导出失败');
});
$('#btn-stop').addEventListener('click', async () => {
  const r = await jpost('/weibo-chat/api/stop');
  if (!r.ok) toast(r.error);
});
$('#btn-clear').addEventListener('click', () => { $('#log').innerHTML = ''; });

loadSummary().then(poll);
</script>
<script src="/back.js" defer></script>
</body>
</html>
