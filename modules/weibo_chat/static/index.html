<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微博聊天记录导出</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:#f4f6fa;color:#1f2937;line-height:1.6;min-height:100vh;padding:0}
.wrap{max-width:1020px;margin:0 auto;padding:24px 20px 48px}
.sub{font-size:12.5px;color:#8b95a5;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #edf0f5;border-radius:14px;padding:16px 17px;
  box-shadow:0 1px 3px rgba(16,24,40,.04);min-height:132px;display:flex;flex-direction:column}
.card h2{font-size:12px;font-weight:650;color:#94a3b8;letter-spacing:.5px;margin-bottom:10px}
.big{font-size:20px;font-weight:650;letter-spacing:-.2px}
.muted{color:#8b95a5;font-size:12.5px}
.state{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.pill{font-size:11px;font-weight:650;padding:2px 9px;border-radius:20px;background:#f1f5f9;color:#64748b}
.pill.ok{background:#e8f9ef;color:#16a34a}
.pill.warn{background:#fff7ed;color:#c2410c}
.pill.err{background:#fef2f2;color:#dc2626}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:#8b95a5}
.kv span:last-child{color:#334155;font-weight:550;text-align:right;word-break:break-all}
section{margin-top:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-size:13.5px;font-weight:600;border-radius:10px;padding:9px 16px;cursor:pointer;
  border:1px solid #e2e8f0;background:#fff;color:#334155;transition:.15s}
button:hover:not(:disabled){border-color:#bfd3f9;color:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.08)}
button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
button.primary:hover:not(:disabled){background:#1d4ed8;color:#fff}
button.danger{color:#dc2626;border-color:#fecaca;background:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.small{padding:5px 11px;font-size:12px}
.note{margin-top:10px;font-size:12px;color:#94a3b8}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#64748b;cursor:pointer;user-select:none}
.log-card{background:#0f172a;border-radius:14px;padding:14px 16px;border:1px solid #1e293b}
.log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-head b{font-size:12px;color:#94a3b8;letter-spacing:.5px;font-weight:650}
.log{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px;line-height:1.65;
  color:#cbd5e1;white-space:pre-wrap;word-break:break-all;height:340px;overflow:auto}
.log .err{color:#fca5a5}
.log .ok{color:#86efac}
.log .sys{color:#93c5fd}
.empty{color:#64748b;font-style:italic}
.view-tab{border:0;background:transparent;color:#64748b;font:600 13px/1 inherit;padding:8px 16px;border-radius:8px;cursor:pointer}
.view-tab.active{background:#fff;color:#2563eb;box-shadow:0 1px 4px rgba(16,24,40,.12)}
.view-records{height:calc(100vh - 132px);min-height:480px;border:1px solid #edf0f5;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.records-frame{width:100%;height:100%;border:0;display:block;background:#fff}
.records-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px}
</style>
<link rel="stylesheet" href="/shared/mp_ui.css?v=2">
<script src="/shared/mp_ui.js?v=2"></script>
</head>
<body>
<header class="mp-topbar">
  <div class="mp-brand">
    <span class="dot"></span>
    <div><b>微博聊天记录</b><small>私信导出 · 离线浏览</small></div>
  </div>
  <nav class="mp-tabs" id="viewTabs">
    <button class="view-tab active" type="button" data-view="console">导出控制台</button>
    <button class="view-tab" type="button" data-view="records">聊天记录</button>
  </nav>
  <div class="mp-spacer"></div>
  <span class="mp-status" id="topStatus">空闲</span>
  <div class="mp-acct">
    <button class="mp-chip" id="acctChip" type="button" title="切换微博账号">
      <span class="mp-ava" id="chipAva">?</span>
      <span class="nm" id="chipName">加载中</span>
      <span class="mp-caret">▾</span>
    </button>
    <div class="mp-menu" id="acctMenu"></div>
  </div>
  <button class="mp-login" id="btn-login" type="button">登录 / 添加账号</button>
  <button class="mp-manage" id="btnAccounts" type="button">账号管理</button>
</header>

<div class="wrap">
  <div id="view-console">
  <div class="grid">
    <div class="card">
      <h2>登录状态</h2>
      <div class="state"><span id="acct-dot" class="pill">未检测</span><span id="acct-name" class="muted">—</span></div>
      <div class="kv"><span>登录态文件</span><span id="state-file">—</span></div>
      <div class="kv"><span>检测时间</span><span id="acct-time">—</span></div>
      <div style="margin-top:auto;padding-top:10px">
        <button class="small" id="btn-check">检测登录状态</button>
      </div>
    </div>

    <div class="card">
      <h2>最近导出</h2>
      <div class="big" id="sum-conv">—</div>
      <div class="muted" id="sum-msg">还没有导出记录</div>
      <div class="kv" style="margin-top:8px"><span>导出时间</span><span id="sum-time">—</span></div>
      <div class="kv"><span>媒体文件</span><span id="sum-media">—</span></div>
      <div class="kv"><span>增量基线</span><span id="sum-inc">—</span></div>
    </div>

    <div class="card">
      <h2>当前任务</h2>
      <div class="state"><span id="task-pill" class="pill">空闲</span></div>
      <div class="kv" style="margin-top:6px"><span>启动时间</span><span id="task-start">—</span></div>
      <div class="kv"><span>退出码</span><span id="task-code">—</span></div>
      <div class="kv"><span>Node.js</span><span id="task-node">—</span></div>
    </div>
  </div>

  <section class="actions">
    <button class="primary" id="btn-run">开始导出</button>
    <button class="danger" id="btn-stop" disabled>停止</button>
    <label class="chk"><input type="checkbox" id="full"> 全量重建（不合并旧记录）</label>
  </section>
  <div class="note">首次使用先登录微博；默认增量导出只补新消息。导出会打开无头 Chrome 复用登录态，登录和导出期间请勿重复触发。</div>

  <section class="log-card">
    <div class="log-head"><b>运行日志</b><button class="small" id="btn-clear">清屏</button></div>
    <div class="log" id="log"><div class="empty">等待任务…</div></div>
  </section>
  </div>

  <div id="view-records" style="display:none">
    <div class="view-records">
      <div class="records-empty" id="recordsEmpty">还没有导出记录，先在「导出控制台」导出一次。</div>
      <iframe id="recordsFrame" class="records-frame" style="display:none" title="微博聊天记录"></iframe>
    </div>
  </div>
</div>

<div class="mp-acct-modal" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
  <div class="mp-acct-dialog">
    <div class="mp-acct-head">
      <div>
        <b id="accountModalTitle">账号管理</b>
        <div class="sub">登录态、聊天记录和导出数据都按账号隔离，切换后立即生效。</div>
      </div>
      <button class="mp-acct-x" id="accountsClose" type="button" title="关闭">×</button>
    </div>
    <div class="mp-acct-body" id="accountList"></div>
    <div class="mp-acct-foot">
      <button class="primary" id="accountsAdd" type="button">登录 / 添加账号</button>
      <button id="accountsRefresh" type="button">刷新列表</button>
      <span class="spacer"></span>
      <span class="note">账号数据保存在本机</span>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let since = 0;
let polling = false;
let hasViewer = false;
let currentView = 'console';
let accountsList = [];
let summaryInfo = {};
let timer = null;

if (new URLSearchParams(location.search).get('embed') === '1') {
  document.body.classList.add('mp-embedded');
}

function fmtTs(sec) {
  if (!sec) return '—';
  const d = new Date(sec * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtAny(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return fmtTs(d.getTime() / 1000);
}
async function jget(url) {
  const r = await fetch(url, { cache: 'no-store' });
  return r.json();
}
async function jpost(url) {
  const r = await fetch(url, { method: 'POST' });
  return r.json();
}
function toast(msg) {
  if (!msg) return;
  const log = $('#log');
  const div = document.createElement('div');
  div.className = 'err';
  div.textContent = '[界面] ' + msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function loadAccounts() {
  try {
    const d = await jget('/weibo-chat/api/accounts');
    accountsList = d.accounts || [];
    renderAccountChrome();
  } catch (e) { /* 忽略 */ }
}

function accountName(a) {
  return (a && (a.nickname || a.name || a.uid)) || '账号';
}
function accountSub(a) {
  if (!a) return '';
  const bits = [];
  if (a.nickname && a.name) bits.push(a.name);
  if (a.uid) bits.push('UID ' + a.uid);
  return bits.join(' · ');
}
function activeAccount() {
  return accountsList.find(a => a.active) || accountsList[0] || null;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function renderAccountChrome() {
  const cur = activeAccount();
  $('#chipName').textContent = accountName(cur);
  $('#chipAva').textContent = accountName(cur).trim().charAt(0) || '?';
  let menu = '<div class="mp-menu-head">切换微博账号</div>';
  if (!accountsList.length) {
    menu += '<div class="mp-menu-note">还没有账号，点击上方「登录 / 添加账号」。</div>';
  } else {
    for (const a of accountsList) {
      const sub = accountSub(a) || (a.logged_in ? '已登录' : '未登录');
      menu += '<button type="button" class="mp-menu-item" data-switch="' + esc(a.id) + '">' +
        '<span class="mp-ava">' + esc(accountName(a).trim().charAt(0) || '?') + '</span>' +
        '<div class="mi-main"><b>' + esc(a.name || a.nickname || '账号') +
        (a.active ? '<span class="tag">当前</span>' : '') + '</b>' +
        '<small>' + esc(sub) + '</small></div>' +
        '<span class="tick">' + (a.active ? '✓' : '') + '</span></button>';
    }
  }
  menu += '<div class="mp-menu-sep"></div>' +
    '<button type="button" class="mp-menu-item" data-open-accounts>' +
    '<span class="tick">⚙</span><div class="mi-main"><b>账号管理</b></div></button>';
  $('#acctMenu').innerHTML = menu;

  const list = $('#accountList');
  if (!accountsList.length) {
    list.innerHTML = '<div class="mp-acct-empty">还没有账号，点击下方「登录 / 添加账号」。</div>';
    return;
  }
  list.innerHTML = accountsList.map(a => {
    const sub = accountSub(a) || (a.logged_in ? '已登录' : '未登录');
    return '<div class="mp-acct-row' + (a.active ? ' current' : '') + '">' +
      '<span class="mp-ava ava">' + esc(accountName(a).trim().charAt(0) || '?') + '</span>' +
      '<div class="info"><div class="nm">' + esc(a.name || a.nickname || '账号') +
      (a.active ? '<span class="tag">当前</span>' : '') + '</div>' +
      '<div class="uid">' + esc(sub) + '</div></div>' +
      '<div class="ops">' +
      (!a.active ? '<button type="button" data-act="switch" data-id="' + esc(a.id) + '">切换</button>' : '') +
      '<button type="button" data-act="login" data-id="' + esc(a.id) + '">登录</button>' +
      '<button type="button" data-act="rename" data-id="' + esc(a.id) + '">重命名</button>' +
      '<button type="button" class="danger" data-act="delete" data-id="' + esc(a.id) + '">删除</button>' +
      '</div></div>';
  }).join('');
}

function toggleMenu(open) {
  const menu = $('#acctMenu');
  const next = open === undefined ? !menu.classList.contains('open') : open;
  menu.classList.toggle('open', next);
  if (next) renderAccountChrome();
}
function openAccountsModal() {
  closeMenu();
  renderAccountChrome();
  $('#accountModal').classList.add('open');
}
function closeAccountsModal() {
  $('#accountModal').classList.remove('open');
}
function closeMenu() {
  $('#acctMenu').classList.remove('open');
}

async function switchAccount(id) {
  if (!id) return;
  closeMenu();
  try {
    const r = await fetch('/weibo-chat/api/accounts/switch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '切换失败');
    await loadAccounts();
    await loadSummary();
    $('#acct-dot').textContent = '未检测';
    $('#acct-dot').className = 'pill';
    $('#acct-name').textContent = '—';
    $('#acct-time').textContent = '—';
    if (currentView === 'records') showView('records', true);
  } catch (e) {
    alert(e.message || '切换失败');
    await loadAccounts();
  }
}

async function createAccount(name) {
  if (name === undefined) {
    name = prompt('新账号备注名（留空自动命名）', '');
    if (name === null) return null;
  }
  try {
    const r = await fetch('/weibo-chat/api/accounts/create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '新建失败');
    await loadAccounts();
    await loadSummary();
    return d.account || null;
  } catch (e) {
    alert(e.message || '新建失败');
    return null;
  }
}

async function renameAccount(id) {
  const cur = accountsList.find(a => a.id === id) || activeAccount();
  if (!cur) return;
  const name = prompt('修改账号备注名', cur.name || '');
  if (name === null || !name.trim()) return;
  try {
    const r = await fetch('/weibo-chat/api/accounts/rename', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: cur.id, name: name.trim() }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '重命名失败');
    await loadAccounts();
  } catch (e) { alert(e.message || '重命名失败'); }
}

async function deleteAccount(id) {
  const cur = accountsList.find(a => a.id === id) || activeAccount();
  if (!cur) return;
  if (!confirm('确定删除账号「' + (cur.name || cur.nickname || '') + '」？会同时删除它的登录态和导出数据，不可恢复。')) return;
  try {
    const r = await fetch('/weibo-chat/api/accounts/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: cur.id }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '删除失败');
    await loadAccounts();
    await loadSummary();
    if (currentView === 'records') showView('records', true);
  } catch (e) { alert(e.message || '删除失败'); }
}

async function loginOrAddAccount() {
  closeMenu();
  closeAccountsModal();
  const cur = activeAccount();
  const loggedIn = !!(cur && (cur.uid || cur.nickname)) || !!(summaryInfo && summaryInfo.state_exists);
  if (loggedIn) {
    const name = prompt('当前账号已登录。请输入新账号备注名（留空自动命名）', '');
    if (name === null) return;
    const created = await createAccount(name);
    if (!created) return;
  }
  if (!confirm('将打开有头 Chrome 窗口显示微博二维码，请在窗口内扫码。继续？')) return;
  startTask('/weibo-chat/api/login', '启动登录失败', true);
}

async function loginRowAccount(id) {
  const cur = accountsList.find(a => a.id === id);
  if (!cur) return;
  if (!cur.active) await switchAccount(id);
  if (!confirm('将打开有头 Chrome 窗口显示微博二维码，请在窗口内扫码。继续？')) return;
  startTask('/weibo-chat/api/login', '启动登录失败', true);
}

async function refreshIdentity() {
  try {
    const r = await jget('/weibo-chat/api/account');
    if (r && r.ok && r.logged_in) await loadAccounts();
  } catch (e) { /* 忽略 */ }
}

async function loadSummary() {
  try {
    const d = await jget('/weibo-chat/api/summary');
    const s = d.data || {};
    summaryInfo = s;
    $('#state-file').textContent = s.state_exists ? '已保存' : '无';
    $('#sum-conv').textContent = s.conversations != null ? `${s.conversations} 个会话` : '—';
    $('#sum-msg').textContent = s.messages != null ? `${s.messages} 条消息` : '还没有导出记录';
    $('#sum-time').textContent = fmtAny(s.exported_at);
    $('#sum-media').textContent = (s.images || 0) + (s.audio || 0) + (s.videos || 0) + ' 个';
    $('#sum-inc').textContent = s.incremental === true ? '可用' : (s.raw_mtime ? '需全量重建' : '—');
    hasViewer = !!s.export_html;
    if (currentView === 'records') showView('records', true);
  } catch (e) {
    toast('读取概览失败');
  }
}

function showView(view, force) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  $('#view-console').style.display = view === 'console' ? '' : 'none';
  $('#view-records').style.display = view === 'records' ? '' : 'none';
  if (view === 'console') { loadSummary(); return; }
  if (view !== 'records') return;
  const frame = $('#recordsFrame');
  const empty = $('#recordsEmpty');
  if (!hasViewer) {
    empty.style.display = 'flex';
    empty.textContent = '还没有导出记录，先在「导出控制台」导出一次。';
    frame.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  frame.style.display = 'block';
  if (force || !frame.src || frame.src === 'about:blank') {
    frame.src = '/weibo-chat/viewer?v=' + Date.now();
  }
}

function renderTask(t) {
  const pill = $('#task-pill');
  const running = !!t.running;
  const labels = { export: '导出中', login: '登录中', full: '全量导出中' };
  const label = running ? (labels[t.kind] || '运行中') : (t.exit_code == null ? '空闲' : (t.exit_code === 0 ? '上次成功' : '上次失败'));
  pill.textContent = label;
  $('#topStatus').textContent = label;
  pill.className = 'pill ' + (running ? 'warn' : (t.exit_code === 0 ? 'ok' : (t.exit_code == null ? '' : 'err')));
  $('#task-start').textContent = fmtTs(t.started_at);
  $('#task-code').textContent = t.exit_code == null ? '—' : t.exit_code;
  $('#task-node').textContent = t.node ? '已就绪' : '未安装';
  $('#btn-stop').disabled = !running;
  for (const id of ['btn-login', 'btn-run']) $('#' + id).disabled = running;
}

function appendLogs(items) {
  if (!items || !items.length) return;
  const log = $('#log');
  const empty = log.querySelector('.empty');
  if (empty) empty.remove();
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  for (const it of items) {
    const div = document.createElement('div');
    const line = it.line || '';
    if (/失败|错误|未找到|Error|error/.test(line)) div.className = 'err';
    else if (/成功|完成|✅/.test(line)) div.className = 'ok';
    else if (line.startsWith('$ ') || line.startsWith('[wrapper]')) div.className = 'sys';
    div.textContent = line;
    log.appendChild(div);
  }
  while (log.childElementCount > 1200) log.firstElementChild.remove();
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

async function poll(refreshAfter) {
  if (polling) return;
  polling = true;
  try {
    while (true) {
      const d = await jget(`/weibo-chat/api/logs?since=${since}`);
      appendLogs(d.logs);
      since = (d.task && d.task.seq) || since;
      renderTask(d.task || {});
      if (!d.task || !d.task.running) break;
      await new Promise((r) => setTimeout(r, 1200));
    }
  } catch (e) {
    toast('日志轮询中断');
  } finally {
    polling = false;
    loadSummary();
    loadAccounts();
    if (refreshAfter) refreshIdentity();
  }
}

async function startTask(url, failMsg, refreshAfter) {
  try {
    const r = await jpost(url);
    if (!r.ok) { toast(r.error || failMsg); return; }
    $('#log').innerHTML = '';
    since = 0;
    poll(refreshAfter);
  } catch (e) {
    toast(failMsg);
  }
}

$('#btn-check').addEventListener('click', async (ev) => {
  const btn = ev.target;
  btn.disabled = true;
  btn.textContent = '检测中…';
  try {
    const r = await jget('/weibo-chat/api/account');
    const dot = $('#acct-dot');
    if (!r.ok) {
      dot.textContent = '检测失败';
      dot.className = 'pill err';
      toast(r.error);
    } else if (r.logged_in) {
      dot.textContent = '已登录';
      dot.className = 'pill ok';
      $('#acct-name').textContent = r.name || r.uid || '';
      await loadAccounts();
    } else {
      dot.textContent = '未登录';
      dot.className = 'pill err';
      $('#acct-name').textContent = r.note || '请扫码登录';
    }
    $('#acct-time').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    toast('检测登录状态失败');
  }
  btn.disabled = false;
  btn.textContent = '检测登录状态';
});

$('#btn-login').addEventListener('click', loginOrAddAccount);
$('#btn-run').addEventListener('click', () => {
  const full = $('#full').checked;
  if (full && !confirm('全量重建会重新拉取所有会话（可长达数分钟），并替换已有记录，确定继续？')) return;
  startTask('/weibo-chat/api/run?mode=' + (full ? 'full' : 'incremental'), '启动导出失败');
});
$('#btn-stop').addEventListener('click', async () => {
  const r = await jpost('/weibo-chat/api/stop');
  if (!r.ok) toast(r.error);
});
$('#btn-clear').addEventListener('click', () => { $('#log').innerHTML = ''; });
$('#viewTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.view-tab');
  if (btn) showView(btn.dataset.view, btn.dataset.view === 'records');
});

$('#acctChip').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleMenu();
});
$('#acctMenu').addEventListener('click', (e) => {
  e.stopPropagation();
  const item = e.target.closest('.mp-menu-item');
  if (!item) return;
  if (item.dataset.switch) switchAccount(item.dataset.switch);
  else if (item.hasAttribute('data-open-accounts')) openAccountsModal();
});
document.addEventListener('click', () => closeMenu());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeMenu(); closeAccountsModal(); }
});
$('#btnAccounts').addEventListener('click', openAccountsModal);
$('#accountsClose').addEventListener('click', closeAccountsModal);
$('#accountsRefresh').addEventListener('click', loadAccounts);
$('#accountsAdd').addEventListener('click', loginOrAddAccount);
$('#accountModal').addEventListener('click', (e) => {
  if (e.target.id === 'accountModal') closeAccountsModal();
});
$('#accountList').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.act === 'switch') switchAccount(id);
  else if (btn.dataset.act === 'login') loginRowAccount(id);
  else if (btn.dataset.act === 'rename') renameAccount(id);
  else if (btn.dataset.act === 'delete') deleteAccount(id);
});

loadAccounts().then(loadSummary).then(poll);
</script>
<script src="/back.js" defer></script>
</body>
</html>
